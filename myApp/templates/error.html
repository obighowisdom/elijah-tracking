{% load static %}

{% block content %}

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="shortcut icon" href="../static/image/logo.png" type="image/x-icon">

    <title>TrackWise - To every direction</title>

    <!-- 
    - favicon
  -->
    <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">

    <!-- 
    - custom css link
  -->
    <link rel="stylesheet" href="{% static 'css/style.css'%}">

    <!--
    - google font link
  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rubik:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- 
    - preload images
  -->
</head>

<body id="top">

    <!-- 
    - #HEADER
  -->

    <header class="header" data-header>
        <div class="container">

            <div>
        <a href="#" class="logo"
          ><img
            src="../static/image/logo.png"
            width="80px"
            height="80px"
            alt=""
        /></a>
      </div>


            <div class="header-contact">

                <div>
                    <p class="contact-label">Free Call In U.S.A</p>

                    <a href="tel:12345678910" class="contact-number">+1 (425) 243-3460</a>
                </div>

                <div class="contact-icon">
                    <ion-icon name="call-outline"></ion-icon>
                </div>

            </div>

            <button class="nav-open-btn" aria-label="Open menu" data-nav-toggler>
                <ion-icon name="menu-outline"></ion-icon>
            </button>

            <div class="overlay" data-nav-toggler data-overlay></div>

        </div>
    </header>
    <section class="section hero" aria-label="home" id="home"
        style="background-image: url('../static/image/logistic.jpg')">
        <div class="container">

            <div class="track">
                <form method="post">
                 <p class="error">INVALID TRACKING ID</p>
                </form>
            </div>

        </div>
    </section>
</body>
